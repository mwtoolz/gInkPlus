
----------
[Hotkeys]

# The global hotkey to start drawing
# e.g.
# Hotkey_Global = None
# Hotkey_Global = Ctrl + Alt + Shift + X
Hotkey_Global = Ctrl + Alt + G

# Hotkey for each tool
Hotkey_Eraser = E
Hotkey_Line = L
Hotkey_Dotted_Line = D
Hotkey_Arrow_Line = A
Hotkey_Rectangle = R
Hotkey_Filled_Rectangle = Ctrl + R
Hotkey_Circle = C
Hotkey_Filled_Circle = Ctrl + C

Hotkey_Pan = None
Hotkey_Pointer = None
Hotkey_InkVisible = V
Hotkey_Snapshot = Ctrl + Alt + S
Hotkey_Undo = Ctrl + Z
Hotkey_Redo = Ctrl + Y
Hotkey_Clear = None

# Hotkey for each pen
Pen0_Hotkey = 0
Pen1_Hotkey = 1
Pen2_Hotkey = 2
Pen3_Hotkey = 3
Pen4_Hotkey = 4
Pen5_Hotkey = 5
Pen6_Hotkey = 6
Pen7_Hotkey = 7
Pen8_Hotkey = 8
Pen9_Hotkey = 9
